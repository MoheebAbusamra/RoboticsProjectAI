# Copied from arc_nav/config/slam_toolbox.yaml (course repo). Only the frame and topic
# names changed, to robot1's namespace. Do not tune without evidence (Lab 3).
slam_toolbox:
  ros__parameters:
    use_sim_time: true
    odom_frame: robot1/odom
    map_frame: map
    base_frame: robot1/base_footprint
    scan_topic: /robot1/scan
    mode: mapping
    resolution: 0.05
    max_laser_range: 12.0
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    map_update_interval: 2.0
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    minimum_travel_distance: 0.3
    minimum_travel_heading: 0.3
    scan_buffer_size: 10
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
