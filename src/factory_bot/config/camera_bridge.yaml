# Lazy subscribers stop camera rendering when no ROS viewer needs its frames.
- ros_topic_name: /robot1/camera/image_raw
  gz_topic_name: /robot1/camera/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  lazy: true
  qos_profile: SENSOR_DATA
  subscriber_queue: 1
  publisher_queue: 1
- ros_topic_name: /robot1/camera/camera_info
  gz_topic_name: /robot1/camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
  lazy: true
  qos_profile: SENSOR_DATA
  subscriber_queue: 1
  publisher_queue: 1
- ros_topic_name: /robot2/camera/image_raw
  gz_topic_name: /robot2/camera/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  lazy: true
  qos_profile: SENSOR_DATA
  subscriber_queue: 1
  publisher_queue: 1
- ros_topic_name: /robot2/camera/camera_info
  gz_topic_name: /robot2/camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
  lazy: true
  qos_profile: SENSOR_DATA
  subscriber_queue: 1
  publisher_queue: 1
