# Moving and placeable obstacles, in GAZEBO world coordinates (the mover talks to Gazebo).
# Everything starts parked outside the walls (x = 14), so the saved map never contains them.
# give_way: a mover holds still while a robot is closer than this (m) to where it would step next
#   (forklift: half its 1.2 x 0.8 m size + robot + margin; worker: smaller).
# AI-assisted (Claude): cite in report.
world: factory
rate_hz: 5.0
movers:
  forklift_1:
    route: [[2.5, 6.5], [9.0, 6.5]]      # back and forth along the main aisle
    speed: 0.4
    z: 0.5
    parked: [14.0, 2.0]
    give_way: 1.3
  worker_1:
    route: [[10.3, 2.5], [10.3, 9.5]]    # up and down the assembly corridor
    speed: 0.3
    z: 0.85
    parked: [14.0, 4.0]
    give_way: 0.9
placeable:                               # only moved by /fleet/obstacle_event
  pallet_1:
    z: 0.3
    parked: [14.0, 6.0]
    drop_points:
      main_aisle: [4.0, 6.5]
      left_aisle: [1.2, 4.5]
